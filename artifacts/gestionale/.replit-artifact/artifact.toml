kind = "web"
previewPath = "/"
title = "Gestionale Personale"
version = "1.0.0"
id = "artifacts/gestionale"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22807

[services.development]
run = "pnpm --filter @workspace/gestionale run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gestionale", "run", "build" ]
publicDir = "artifacts/gestionale/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22807"
BASE_PATH = "/"
